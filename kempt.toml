# kempt.toml — declarative description of this machine's dotfiles + tools.
# Authored from packages/*/pkg.sh, the Brewfiles, and the live machine config.
# Scope: core, terminal, nvim, markedit, claude, codex, swiftbar, muster,
# galley, pi, pi-channels, pi-llama.
# (cursor dropped — the cursor-agent CLI was never set up; see the cursor note
# below. pi-llama is optional and NOT in the developer profile — adopt it only
# on a box with local GGUF weights.)

[kempt]
spec = 1

# ---------------------------------------------------------------------------
# core — shell foundation: brew CLI tools, zsh, starship, atuin
# ---------------------------------------------------------------------------
[packages.core]
description = "Shell foundation: Homebrew CLI tools, zsh config, Starship prompt, Atuin history"

  [[packages.core.install]]
  brew.taps = ["1password/tap"]
  brew.formulas = [
    "starship", "atuin", "zsh-completions", "eza", "bat", "zoxide", "fzf",
    "fd", "ripgrep", "git-delta", "lazygit", "tlrc", "htop", "tree", "jq",
    "yq", "gh", "git", "git-lfs", "pipx", "uv", "awscli",
  ]
  brew.casks = ["1password-cli", "visual-studio-code", "docker-desktop"]

  [[packages.core.symlink]]
  from = ".zshrc"
  to = "~/.zshrc"
  backup = true

  [[packages.core.symlink]]
  from = "config/zsh"
  to = "~/.config/zsh"
  backup = true

  [[packages.core.symlink]]
  from = "config/starship.toml"
  to = "~/.config/starship.toml"
  backup = true

  [[packages.core.symlink]]
  from = "config/atuin"
  to = "~/.config/atuin"
  backup = true

  # harness session-stamp — referenced by the claude + codex SessionStart hooks
  # through this stable ~/.local/bin path, so it resolves no matter where the
  # config repo is cloned (kempt init defaults to ~/.config/kempt/repo, not
  # ~/dotfiles). Lives in core because both harnesses depend on core.
  [[packages.core.symlink]]
  from = "bin/harness-session-stamp.sh"
  to = "~/.local/bin/harness-session-stamp"
  backup = false

  [[packages.core.verify]]
  command-exists = "starship"

  [[packages.core.verify]]
  command-exists = "atuin"

  [[packages.core.verify]]
  symlink-target = { link = "~/.zshrc", target = ".zshrc" }

# ---------------------------------------------------------------------------
# terminal — Ghostty, tmux (+plugins), yazi, nerd fonts, scratch
# ---------------------------------------------------------------------------
[packages.terminal]
description = "Terminal workspace: Ghostty, tmux (+plugins), yazi file explorer, nerd fonts"
needs = ["core"]

  # just + lefthook: every .tools family repo's `just verify` and pre-push hook
  # (the same gate CI runs) need both; go builds them. bash: a current bash 5
  # for scripts and test suites that CI runs under bash 5 (tools-actions'
  # fork-sync suite refuses macOS's /bin/bash 3.2). /bin/bash is untouched.
  [[packages.terminal.install]]
  brew.formulas = ["tmux", "yazi", "go", "just", "lefthook", "bash"]
  brew.casks = [
    "ghostty", "font-fira-code-nerd-font", "font-meslo-lg-nerd-font",
    "font-jetbrains-mono-nerd-font", "font-monaspice-nerd-font",
  ]

  [[packages.terminal.symlink]]
  from = "config/ghostty/config"
  to = "~/.config/ghostty/config"
  backup = true

  [[packages.terminal.symlink]]
  from = ".tmux.conf"
  to = "~/.tmux.conf"
  backup = true

  [[packages.terminal.symlink]]
  from = "config/yazi"
  to = "~/.config/yazi"
  backup = true

  # scratch + proj — installed from tackle.tools/dl (the family download
  # contract), each verified against its .sha256 sidecar.
  [[packages.terminal.download]]
  site = "tackle.tools"
  tool = "scratch"
  bin = "scratch"

  [[packages.terminal.download]]
  site = "tackle.tools"
  tool = "proj"
  bin = "proj"

  # creel — masked secret capture into a local .env (prefix S, and the pi
  # request_secret tool). Same family download contract as scratch/proj.
  [[packages.terminal.download]]
  site = "tackle.tools"
  tool = "creel"
  bin = "creel"

  [[packages.terminal.verify]]
  command-exists = "tmux"

  [[packages.terminal.verify]]
  command-exists = "scratch"

  [[packages.terminal.verify]]
  command-exists = "proj"

  [[packages.terminal.verify]]
  command-exists = "creel"

# ---------------------------------------------------------------------------
# nvim — Neovim ($EDITOR) with LazyVim config
# ---------------------------------------------------------------------------
[packages.nvim]
description = "Neovim ($EDITOR) with LazyVim config"
needs = ["core"]

  [[packages.nvim.install]]
  brew.formulas = ["neovim"]

  [[packages.nvim.symlink]]
  from = "config/nvim"
  to = "~/.config/nvim"
  backup = true

  [[packages.nvim.verify]]
  command-exists = "nvim"

  [[packages.nvim.verify]]
  symlink-target = { link = "~/.config/nvim", target = "config/nvim" }

# ---------------------------------------------------------------------------
# markedit — MarkEdit markdown-editor styles
# ---------------------------------------------------------------------------
[packages.markedit]
description = "MarkEdit markdown-editor styles"
needs = ["core"]

  [[packages.markedit.install]]
  brew.casks = ["markedit"]

  [[packages.markedit.symlink]]
  from = "config/markedit/editor.css"
  to = "~/Library/Containers/app.cyan.markedit/Data/Documents/editor.css"
  backup = true

  [[packages.markedit.verify]]
  symlink-target = { link = "~/Library/Containers/app.cyan.markedit/Data/Documents/editor.css", target = "config/markedit/editor.css" }

# ---------------------------------------------------------------------------
# claude — Claude Code statusline, hooks, claude-attn CLI
# ---------------------------------------------------------------------------
[packages.claude]
description = "Claude Code integration: tmux-aware statusline, attention-bell hooks, claude-attn CLI"
needs = ["core"]

  [[packages.claude.symlink]]
  from = "config/claude"
  to = "~/.config/claude"
  backup = true

  [[packages.claude.symlink]]
  from = "bin/claude-attn"
  to = "~/.local/bin/claude-attn"
  backup = false

  # superpowers is removed from the harness (2026-09-30). pi-claude-bridge runs
  # Claude Code with its default setting sources, so an enabled CC plugin's
  # SessionStart hook injects into pi sessions too — keep it off here as well.
  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { enabledPlugins = { "superpowers@claude-plugins-official" = false } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { statusLine = { type = "command", command = "~/.config/claude/statusline.sh" } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { permissions = { allow = ["Bash(*/.claude/sessions/*)"] } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { Notification = [ { hooks = [ { type = "command", command = "~/.config/claude/claude-notify.sh" } ] } ] } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { Stop = [ { hooks = [ { type = "command", command = "~/.config/claude/claude-notify.sh" } ] }, { hooks = [ { type = "command", command = "~/.config/claude/claude-teammate-idle.sh" } ] } ] } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { SessionStart = [ { hooks = [ { type = "command", command = "~/.local/bin/harness-session-stamp" } ] } ] } }

  [[packages.claude.verify]]
  symlink-target = { link = "~/.config/claude", target = "config/claude" }

  [[packages.claude.verify]]
  command-exists = "claude"

# ---------------------------------------------------------------------------
# codex — OpenAI Codex CLI + MCP bridge into Claude Code
# ---------------------------------------------------------------------------
[packages.codex]
description = "OpenAI Codex CLI (GPT agent) + MCP bridge into Claude Code"
needs = ["core"]
notes = ["run `codex login` to authenticate"]

  [[packages.codex.install]]
  brew.casks = ["codex"]

  # session-stamp hook. codex hooks.json does not expand ~, so kempt expands the
  # ${HOME} token at write time into an absolute, per-machine path.
  [[packages.codex.json-merge]]
  file = "~/.codex/hooks.json"
  merge = { hooks = { SessionStart = [ { hooks = [ { type = "command", command = "${HOME}/.local/bin/harness-session-stamp" } ] } ] } }

  # `claude mcp add codex` writes into ~/.claude.json .mcpServers
  [[packages.codex.json-merge]]
  file = "~/.claude.json"
  merge = { mcpServers = { codex = { type = "stdio", command = "codex", args = ["mcp-server"], env = {} } } }

  [[packages.codex.verify]]
  command-exists = "codex"

# ---------------------------------------------------------------------------
# swiftbar — menu-bar attention indicator (🔔 turn-done / 🔐 waiting-on-you per
# Claude/pi session; the plugin at config/swiftbar/plugins/ is driven by
# claude-attn + the pi harness). Actively used, so kempt installs the app; the
# three macOS one-offs (plugin folder, autostart, accessibility) are manual notes.
# ---------------------------------------------------------------------------
[packages.swiftbar]
description = "SwiftBar menu-bar attention indicator for Claude/pi sessions"
needs = ["claude"]
notes = [
  "point SwiftBar at the repo plugins: defaults write com.ameba.SwiftBar PluginDirectory ~/dotfiles/config/swiftbar/plugins",
  "add SwiftBar to Login Items (System Settings) to auto-start it",
  "grant SwiftBar Accessibility permission (System Settings → Privacy) so click-to-focus works",
]

  [[packages.swiftbar.install]]
  brew.casks = ["swiftbar"]

# ---------------------------------------------------------------------------
# cursor — DROPPED: cursor-agent CLI is not installed on this machine (the
# Cursor editor app is present but the CLI/hooks were never set up). Like
# swiftbar, it's out of the managed set. Re-add a [packages.cursor] block if the
# cursor-agent CLI ever joins the setup.
# ---------------------------------------------------------------------------
# muster — cross-terminal agent coordination bus
# ---------------------------------------------------------------------------
[packages.muster]
description = "Cross-terminal agent coordination bus (daemon, MCP + session hooks in Claude, Codex, and pi)"
needs = ["terminal"]
only = { os = "darwin" }

  # muster installs from muster.tools/dl (the family download contract): the
  # `latest` pointer resolves the version, and the asset is verified fail-closed
  # against its .sha256 sidecar. (Was github-release; muster.tools/dl now serves.)
  [[packages.muster.download]]
  site = "muster.tools"
  tool = "muster"
  bin = "muster"

  # Run through a login shell so $HOME expands to an absolute muster path.
  # launchd resolves ProgramArguments[0] against its OWN default PATH (NOT the
  # job's EnvironmentVariables), and muster lives in ~/.local/bin — not on that
  # default path — so a bare `muster` fails to exec (EX_CONFIG, forever). /bin/zsh
  # is absolute and always resolvable; `-lc` gives the login PATH (homebrew for
  # tmux, ~/.local/bin for muster) and `exec` replaces the shell so KeepAlive
  # tracks the muster process directly. Same pattern as pi-llama's router below.
  [[packages.muster.service]]
  label = "tools.muster.serve"
  program = ["/bin/zsh", "-lc", "exec \"$HOME/.local/bin/muster\" serve"]
  stdout = "~/.local/share/muster/serve.log"
  stderr = "~/.local/share/muster/serve.log"

  # MCP registration into Claude (~/.claude.json), Cursor (~/.cursor/mcp.json),
  # and Codex (~/.codex/config.toml).
  [[packages.muster.json-merge]]
  file = "~/.claude.json"
  merge = { mcpServers = { muster = { type = "stdio", command = "muster", args = ["mcp"], env = {} }, "muster-channel" = { type = "stdio", command = "muster", args = ["channel"], env = {} } } }

  [[packages.muster.toml-merge]]
  file = "~/.codex/config.toml"
  merge = { mcp_servers = { muster = { command = "muster", args = ["mcp"] } } }

  # MCP registration into pi. pi-mcp-adapter reads ~/.config/mcp/mcp.json (the
  # all-projects target) and exposes muster's get_inbox/get_thread/reply/... as
  # tools through its lazy mcp() proxy. Until now pi had only the muster CHANNEL
  # (mail push, via [packages.pi-channels] → channels.json) and the `muster` CLI
  # — no MCP tools — so every pi session drained mail by shelling out. This
  # gives pi the same tool surface Claude and Codex already have; the CLI stays
  # the equivalent fallback the guidance names for a session without the tools.
  # Bare `muster` on $PATH matches pi's other mcp.json/channels.json entries
  # (the login PATH includes ~/.local/bin), not the launchd absolute-path class.
  # Deep-merge is additive: hand-added servers (polar, zoho) survive.
  [[packages.muster.json-merge]]
  file = "~/.config/mcp/mcp.json"
  merge = { mcpServers = { muster = { command = "muster", args = ["mcp"] } } }

  # muster hooks into claude settings + permission allowlist
  [[packages.muster.json-merge]]
  file = "~/.claude/settings.json"
  merge = { permissions = { allow = ["mcp__muster"] } }

  [[packages.muster.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { Stop = [ { hooks = [ { type = "command", command = "~/.local/bin/muster hook Stop claude" } ] } ] } }

  [[packages.muster.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { SessionStart = [ { matcher = "startup|resume", hooks = [ { type = "command", command = "~/.local/bin/muster hook SessionStart claude" } ] } ] } }

  [[packages.muster.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { SessionEnd = [ { hooks = [ { type = "command", command = "~/.local/bin/muster hook SessionEnd claude" } ] } ] } }

  # muster hooks into codex hooks.json. codex does not expand ~, so kempt expands
  # the ${HOME} token at write time into an absolute, per-machine path.
  [[packages.muster.json-merge]]
  file = "~/.codex/hooks.json"
  merge = { hooks = { SessionStart = [ { hooks = [ { type = "command", command = "${HOME}/.local/bin/muster hook SessionStart codex" } ] } ], Stop = [ { hooks = [ { type = "command", command = "${HOME}/.local/bin/muster hook Stop codex" } ] } ] } }

  [[packages.muster.verify]]
  command-exists = "muster"

# ---------------------------------------------------------------------------
# galley — Markdown/HTML review page shared with Claude Code (a browser review
# loop; press Revise, Claude rewrites, changes land marked). The binary installs
# from galley.tools/dl.
#
# The Claude Code channel IS wired machine-level, because the claude() wrapper
# in config/zsh/04-aliases.zsh unconditionally launches every interactive
# session with `--dangerously-load-development-channels server:galley
# server:muster-channel`. That `server:galley` names an MCP server, so a server
# named `galley` (= `galley channel`) must be registered in ~/.claude.json or
# the flag resolves to nothing and Revise never wakes the pane. This mirrors
# muster-channel's registration and the pi half in [packages.pi-channels]; an
# earlier note here called this per-project and left it unwired, which is why
# the galley channel silently never attached under Claude.
# ---------------------------------------------------------------------------
[packages.galley]
description = "Markdown/HTML review page shared with Claude Code (galley.tools)"
needs = ["core"]
only = { os = "darwin" }

  [[packages.galley.download]]
  site = "galley.tools"
  tool = "galley"
  bin = "galley"

  # Register the `galley` channel server so the wrapper's `server:galley`
  # resolves. Named `galley` to match the flag; command mirrors pi's
  # channels.json entry (`galley channel`).
  [[packages.galley.json-merge]]
  file = "~/.claude.json"
  merge = { mcpServers = { galley = { type = "stdio", command = "galley", args = ["channel"], env = {} } } }

  [[packages.galley.verify]]
  command-exists = "galley"

# ---------------------------------------------------------------------------
# casebook — the fate of every repo, PR, issue, branch and worktree
# (casebook.tools; binary from tackle.tools/dl). Mirrors tackle's
# cmd/casebook/kempt.toml, folded in here so `kempt update` keeps it current.
# pi-casebook is in the pi package's list below (dotfiles owns that list); the
# pi channel entry is in pi-channels. First run on a new machine:
# `casebook init` and `casebook hooks install` (see casebook.tools/guide).
# ---------------------------------------------------------------------------
[packages.casebook]
description = "casebook: triage page, agent channel, rules and apply (casebook.tools)"
needs = ["core"]
only = { os = "darwin" }

  [[packages.casebook.download]]
  site = "tackle.tools"
  tool = "casebook"
  bin = "casebook"

  # Claude Code: journal Bash tool calls; brief the session on its repo.
  [[packages.casebook.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { PostToolUse = [ { matcher = "Bash", hooks = [ { type = "command", command = "~/.local/bin/casebook record --harness claude" } ] } ] } }

  [[packages.casebook.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { SessionStart = [ { matcher = "startup|resume", hooks = [ { type = "command", command = "~/.local/bin/casebook brief" } ] } ] } }

  # Claude Code: the casebook channel and the Stop hook that tells casebook
  # serve the turn ended, so queued page messages go out.
  [[packages.casebook.json-merge]]
  file = "~/.claude.json"
  merge = { mcpServers = { casebook = { type = "stdio", command = "casebook", args = ["channel"], env = {} } } }

  [[packages.casebook.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { Stop = [ { hooks = [ { type = "command", command = "~/.local/bin/casebook settled --harness claude" } ] } ] } }

  # Full sync (including the GitHub refresh) every 30 minutes.
  [[packages.casebook.service]]
  label = "tools.tackle.casebook.sync"
  program = ["/bin/zsh", "-lc", "exec \"$HOME/.local/bin/casebook\" sync"]
  keep-alive = false
  run-at-load = true
  start-interval = 1800
  process-type = "Background"
  session-type = "Aqua"
  stdout = "~/.local/state/casebook/sync.log"
  stderr = "~/.local/state/casebook/sync.log"

  [[packages.casebook.verify]]
  command-exists = "casebook"

# ---------------------------------------------------------------------------
# pi — Pi coding agent (portable). Runs on the claude-bridge provider out of the
# box; no machine-specific inference required. The optional local llama.cpp rig
# lives in the separate `pi-llama` package below.
# ---------------------------------------------------------------------------
#
# AUTHORING NOTES (not user-facing; kept as comments, not `notes`):
#  - pi-provider-guard / pi-tmux-bridge / pi-wakeup / pi-bang are published npm
#    packages in the pi-extensions monorepo, declared in install.pi below. pi-provider-
#    guard reads optional private policy prose from
#    ~/.pi/agent/extensions/pi-provider-guard/config.json; when that file is
#    absent the extension is a no-op, so this package converges cleanly without
#    it (that config is Court's private overlay, not part of this manifest).
[packages.pi]
description = "Pi coding agent (claude-bridge provider) + public extensions"
needs = ["core"]
only = { os = "darwin" }
notes = ["pi-provider-guard reads optional private policy prose from ~/.pi/agent/extensions/pi-provider-guard/config.json (Court's private kempt layer links it); absent = no-op"]

  # node@24: pi runs on the Node LTS line (config/zsh/01-paths.zsh puts it first
  # on PATH; it is keg-only). Not Homebrew's `node`, which tracks the newest
  # major and ships breakage to pi first.
  [[packages.pi.install]]
  brew.formulas = ["ddgr", "pandoc", "node@24"]

  [[packages.pi.install]]
  npm = ["@earendil-works/pi-coding-agent"]

  # pi extensions — npm: identifiers as displayed by `pi list`. Complete set:
  # every live extension is published to npm (no local-path packages remain —
  # the retired schuettc/pi repo's private local packages are now the
  # pi-provider-guard / pi-tmux-bridge / pi-wakeup / pi-bang npm packages below).
  # Matches ~/.pi/agent/settings.json `packages` string-for-string (20/20).
  [[packages.pi.install]]
  # Version policy (kempt >= 0.3.0): an unversioned entry ROLLS to the newest
  # published version (kempt update/upgrade roll it, outdated reports it); a
  # pinned name@version converges to exactly that version. An unversioned git:
  # entry rolls to its repo's default-branch head (kempt >= 0.5.4; older kempt
  # installs it once and never updates it). pi-provider-guard /
  # pi-tmux-bridge / pi-hail / pi-wakeup / pi-bang / pi-auto-reload are Court's own extensions,
  # published to the pi-extensions monorepo (formerly the private local
  # packages in the now-retired schuettc/pi repo).
  pi = [
    # pi-claude-bridge is THE harness (registers the pane with muster on
    # session_start) and is the provider defaultProvider=claude-bridge points at.
    # It MUST load before channels.tools, so keep it first. Court's fork of the
    # third-party project, published to npm from a maintained patch stack.
    "npm:@schuettc/pi-claude-bridge@0.9.1-schuettc.2",
    # Account-wide provider usage meter. Keep immediately after the bridge so
    # its optional Claude adapter is available when the meter starts.
    "npm:@schuettc/pi-usage@0.10.13-schuettc.2",
    # pi-permission-system: Court's fork (schuettc/pi-permission-system, fork-sync),
    # installed UNDER THE UPSTREAM NAME with an npm alias so pi-hail, which
    # imports "@gotgenes/pi-permission-system", resolves to it and the upstream
    # package can never also load (same path). Carries the
    # prompt-answerer seam (pi-hail phone approvals). Bump the version at the END
    # of the string. Retire by pinning plain npm:@gotgenes/pi-permission-system@<v>.
    "npm:@gotgenes/pi-permission-system@npm:@schuettc/pi-permission-system@35.0.1-schuettc.1",
    "npm:@tintinweb/pi-subagents",
    "npm:@bitcraft-apps/pi-web-tools",
    "npm:pi-quiet@0.2.1",
    "npm:@hank-warren/pi-plan-mode",
    "npm:@schuettc/pi-schedule@0.4.0-schuettc.2",
    "npm:@nicknisi/pi-artifacts",
    "npm:channels.tools",
    # pi-mcp-adapter is the MCP bridge: reads .mcp.json / ~/.config/mcp/mcp.json
    # and exposes one lazy mcp() proxy tool (search/describe/execute) instead of
    # dumping every server's tools into context. Remote URL servers + OAuth
    # (keychain-stored) work. Individual MCP servers are configured out of band.
    "npm:pi-mcp-adapter",
    "npm:pi-provider-guard@0.1.0",
    "npm:pi-tmux-bridge@0.1.2",
    "npm:pi-hail",
    "npm:pi-wakeup@0.1.0",
    "npm:pi-creel",
    # pi-bang — `!` completions trigger a model turn; auto-space after `!`.
    "npm:pi-bang",
    # pi-typesafe-ai — TypeSafe Jev credential UX (bare `/typesafe` panel, or setup|status|
    # logout`, key stored at ~/.pi/agent/typesafe/config.json 0600). Also the
    # client library Jev-backed extensions use (subagent model routing, MCP
    # semantic tool search). No network or credential access at load.
    "npm:pi-typesafe-ai@0.2.0",
    # pi-auto-reload — reloads an idle session after installed pi packages
    # change on disk (e.g. after `kempt update`), so sessions never run a mix
    # of old and new extension code. Court's own, from the pi-extensions monorepo.
    "npm:pi-auto-reload@0.1.0",
    # casebook (tackle.tools): journals git/gh bash calls with the pi session,
    # briefs the first turn, syncs in the background. Installed HERE because this
    # manifest owns the packages list; casebook's own manifest
    # (tackle cmd/casebook/kempt.toml) installs everything else. Unpinned (Court,
    # 2026-09-27): kempt rolls it to the latest; casebook publishes the binary
    # before the extension, so a new pi-casebook never arrives ahead of it.
    "npm:pi-casebook",
  ]

  # settings — kempt is AUTHORITATIVE over the live packages/extensions arrays
  # (`arrays = replace`). Every converge resets settings.json `packages` to
  # EXACTLY this list, so it MUST match the install `pi = [...]` above STRING FOR
  # STRING. Why replace, not append: `pi install` is a SECOND writer — it stamps
  # the resolved version of each spec into settings.json packages — so an append
  # merge accumulated both the bare manifest string and pi's version-stamped
  # form, drifting to duplicate entries (pi-quiet + pi-quiet@0.2.0, ...) that
  # append never removed. Replace makes this manifest the single source of truth
  # and is self-healing: any out-of-band or stale entry is dropped on the next
  # `kempt update`. Consequence: every package you want MUST live in this list.
  # extensions holds only "-builtin:mcp": pi-mcp-adapter replaces pi's built-in
  # MCP support, so the built-in stays off; pi loads every other extension from
  # packages. theme / defaultThinkingLevel / hideThinkingBlock are Court's
  # session defaults.
  [[packages.pi.json-merge]]
  file = "~/.pi/agent/settings.json"
  arrays = "replace"
  merge = { defaultProvider = "claude-bridge", defaultModel = "claude-opus-5-5", defaultThinkingLevel = "medium", hideThinkingBlock = true, theme = "dark", compaction = { enabled = true, reserveTokens = 16384, keepRecentTokens = 24000 }, extensions = ["-builtin:mcp"], packages = [ "npm:@schuettc/pi-claude-bridge@0.9.1-schuettc.2", "npm:@schuettc/pi-usage@0.10.13-schuettc.2", "npm:@gotgenes/pi-permission-system@npm:@schuettc/pi-permission-system@35.0.1-schuettc.1", "npm:@tintinweb/pi-subagents", "npm:@bitcraft-apps/pi-web-tools", "npm:pi-quiet@0.2.1", "npm:@hank-warren/pi-plan-mode", "npm:@schuettc/pi-schedule@0.4.0-schuettc.2", "npm:@nicknisi/pi-artifacts", "npm:channels.tools", "npm:pi-mcp-adapter", "npm:pi-provider-guard@0.1.0", "npm:pi-tmux-bridge@0.1.2", "npm:pi-hail", "npm:pi-wakeup@0.1.0", "npm:pi-creel", "npm:pi-bang", "npm:pi-typesafe-ai@0.2.0", "npm:pi-auto-reload@0.1.0", "npm:pi-casebook" ] }

  # pi-permission-system policy. yoloMode is on: tool calls run without asking,
  # and the static policy below still applies its denies (secrets, SSH keys,
  # git stash). No authorizer chain runs (pi-auto-review is removed for now);
  # pi-hail stays the prompt answerer for phone approvals. arrays = "replace"
  # keeps authorizerChain / promptAnswerers exactly as declared here. Deep-merge
  # is additive for the permission rules, so hand-added rules on a machine
  # survive; this block is the authoritative baseline. The allow rules record
  # surfaces that never need a prompt if yolo is ever turned off.
  [[packages.pi.json-merge]]
  file = "~/.pi/agent/extensions/pi-permission-system/config.json"
  arrays = "replace"
  merge = { "$schema" = "https://raw.githubusercontent.com/gotgenes/pi-packages/main/packages/pi-permission-system/schemas/permissions.schema.json", "permission" = { "*" = "ask", "path" = { "*" = "allow", "*.env" = { "action" = "deny", "reason" = "environment files hold secrets; read the .env.example instead" }, "*.env.*" = { "action" = "deny", "reason" = "environment files hold secrets; read the .env.example instead" }, "*.env.example" = "allow", "~/.ssh/*" = { "action" = "deny", "reason" = "SSH keys and config are off limits to the agent" } }, "read" = "allow", "write" = "allow", "edit" = "allow", "WebSearch" = "allow", "WebFetch" = { "*" = "ask", "https://github.com/*" = "allow" }, "bash" = { "*" = "ask", "git stash" = { "action" = "deny", "reason" = "git stash hides work; commit or use a worktree" }, "git stash *" = { "action" = "deny", "reason" = "git stash hides work; commit or use a worktree" }, "git add *" = "allow", "git commit *" = "allow", "git pull *" = "allow", "git fetch *" = "allow", "git ls-tree *" = "allow", "git push --dry-run*" = "allow", "gh pr list *" = "allow", "gh pr view *" = "allow", "gh pr diff *" = "allow", "gh pr checks *" = "allow", "gh repo view *" = "allow", "gh run list *" = "allow", "gh run view *" = "allow", "cd *" = "allow", "grep *" = "allow", "ls *" = "allow", "sleep *" = "allow", "npx --version" = "allow", "npx --help" = "allow", "npm --version" = "allow", "pip --version" = "allow", "pip3 --version" = "allow", "git push *" = "allow", "gh api *" = "allow", "gh auth *" = "allow", "gh pr *" = "allow", "gh repo *" = "allow", "muster" = "allow", "muster *" = "allow", "galley" = "allow", "galley *" = "allow", "aws sso login *" = "allow", "head *" = "allow", "cat *" = "allow", "tail *" = "allow", "sed -n *" = "allow", "sort *" = "allow", "wc *" = "allow", "which *" = "allow", "pwd" = "allow", "git log *" = "allow", "git status" = "allow", "git status *" = "allow", "git diff *" = "allow", "git show *" = "allow", "gh -R *" = "allow", "tmux capture-pane *" = "allow", "git -C * status" = "allow", "git -C * status *" = "allow", "git rev-parse *" = "allow", "go build *" = "allow", "aws s3 ls *" = "allow" }, "mcp" = { "*" = "ask" }, "Agent" = "allow", "get_subagent_result" = "allow", "steer_subagent" = "allow", "grep" = "allow", "find" = "allow", "ls" = "allow", "schedule" = "allow", "pi_codex_usage" = "allow", "request_secret" = "allow", "websearch" = "allow", "webfetch" = { "*" = "ask", "https://github.com/*" = "allow" }, "file_channel_status" = "allow", "skill" = { "*" = "ask", "update-config" = "allow" }, "external_directory" = { "*" = "ask", "~/.nvm/versions/*" = "allow", "/tmp/*" = "allow", "/private/var/folders/*" = "allow", "~/dotfiles/*" = "allow", "~/GitHub/schuettc/*" = "allow" }, "muster_channel_status" = "allow", "galley_channel_status" = "allow", "galley_ack" = "allow", "galley_review" = "allow", "cancel_wakeup" = "allow", "schedule_wakeup" = "allow", "artifact" = "allow" }, "yoloMode" = true, "authorizerChain" = [], "promptAnswerers" = [ "pi-hail" ] }

  # pi-claude-bridge settings: askClaude stays read-only and isolated by
  # default; the provider uses only the MCP servers pi passes it, keeps Claude
  # Code's own auto-memory off (rules live in AGENTS.md / CLAUDE.md files), and
  # never opts into long-context extra usage.
  [[packages.pi.json-merge]]
  file = "~/.pi/agent/claude-bridge.json"
  merge = { askClaude = { enabled = true, defaultMode = "read", defaultIsolated = true, allowFullMode = false }, provider = { strictMcpConfig = true, autoMemoryEnabled = false, longContextExtraUsage = false } }

  # subagent definitions — global custom agents (worker/reviewer) discovered by
  # pi at ~/.pi/agent/agents from any cwd. These are the LEAN-prompt agents (no
  # model pin; the dispatch picks the model, see pi-subagent-dispatch); the built-in
  # general-purpose agent inherits the parent's full system prompt and trips the
  # server-side extra-usage classifier, so a child dispatch has nothing safe to
  # target unless these files are present. Whole-dir symlink: editing the .md in
  # this repo is live immediately here, and `kempt update` propagates it to every
  # machine through the same link.
  [[packages.pi.symlink]]
  from = "config/pi/agents"
  to = "~/.pi/agent/agents"
  backup = true

  [[packages.pi.verify]]
  command-exists = "pi"

  [[packages.pi.verify]]
  symlink-target = { link = "~/.pi/agent/agents", target = "config/pi/agents" }

  # subagent defaults — global subagents.json. fallbackSubagent="none" makes an
  # unknown/misspelled subagent_type fail loudly instead of silently spawning
  # general-purpose (which carries pi's harness block and trips the server-side
  # extra-usage classifier, worst in background/scheduled runs). strictAgentFiles
  # surfaces a broken agent file at startup instead of silently falling through.
  [[packages.pi.symlink]]
  from = "config/pi/subagents.json"
  to = "~/.pi/agent/subagents.json"
  backup = true

  [[packages.pi.verify]]
  symlink-target = { link = "~/.pi/agent/subagents.json", target = "config/pi/subagents.json" }

  # Court's pi skills (config/pi/skills: remembering, pi-subagent-dispatch, the
  # family build/release/onboarding skills, cleaning-up-branches). Whole-dir link
  # into pi's auto-discovered skills dir, so an edit here is live at once. pi
  # only: Claude Code's ~/.claude/skills is not managed here.
  [[packages.pi.symlink]]
  from = "config/pi/skills"
  to = "~/.pi/agent/skills"
  backup = true

  [[packages.pi.verify]]
  symlink-target = { link = "~/.pi/agent/skills", target = "config/pi/skills" }

  # pi skills path — none beyond pi's own auto-discovered ~/.pi/agent/skills
  # (the kempt-managed symlink above) and the skills packages ship. Removed
  # 2026-09-30: ~/.claude/skills (claude.ai-synced docs/docx/pdf/pptx/xlsx plus
  # article-archiver and weekly-retro) and superpowers. arrays=replace keeps it
  # authoritatively empty so neither creeps back in.
  [[packages.pi.json-merge]]
  file = "~/.pi/agent/settings.json"
  arrays = "replace"
  merge = { skills = [] }

# ---------------------------------------------------------------------------
# pi-channels — wire the galley + muster channels into pi sessions.
#
# channels.tools (installed by [packages.pi]) is the bridge, but it spawns
# nothing until ~/.pi/agent/channels.json names the channel servers. This
# package writes that file, so every pi session gets: galley document-review
# rounds and muster mail push (wake-on-event), with each server's tools
# registered under their own names. muster REGISTRATION already happens in the
# harness (pi-claude-bridge session_start); this adds the live channel bridge
# on top. The Claude Code equivalents live in [packages.muster] (MCP) and each
# project's .mcp.json (galley) — this is the pi-side counterpart.
#
# Bare command names (resolved via $PATH): pi spawns channel servers with the
# session's login PATH, which includes ~/.local/bin — so these follow the same
# convention as the Claude/Codex MCP `command` entries, NOT the launchd/codex-
# hooks class that needs absolute ${HOME} paths. Matches live channels.json.
# ---------------------------------------------------------------------------
[packages.pi-channels]
description = "Wire galley, muster and casebook channels into pi sessions (channels.tools → channels.json)"
needs = ["pi", "muster", "galley", "casebook"]
only = { os = "darwin" }

  [[packages.pi-channels.json-merge]]
  file = "~/.pi/agent/channels.json"
  merge = { channelServers = { "muster-channel" = { command = "muster", args = ["channel"] }, galley = { command = "galley", args = ["channel", "--scope", "."] }, casebook = { command = "casebook", args = ["channel"] } } }

# ---------------------------------------------------------------------------
# pi-llama — OPTIONAL local llama.cpp inference rig for pi (Court's own setup).
# Not in the developer profile: it needs GGUF model weights this manifest does
# not fetch, so a fresh machine converges clean WITHOUT it. Add it deliberately
# on a box that has the models with `kempt adopt pi-llama`.
# ---------------------------------------------------------------------------
[packages.pi-llama]
description = "Optional local llama.cpp inference provider + router for pi (requires local GGUF weights)"
needs = ["pi"]
only = { os = "darwin" }
notes = ["download the Qwen3.8 27B + 9B GGUF weights the router serves; pi-llama does not fetch them"]

  [[packages.pi-llama.install]]
  brew.formulas = ["llama.cpp"]

  # llama.cpp provider subtree — SUBSET of live models.json (append array mode).
  [[packages.pi-llama.json-merge]]
  file = "~/.pi/agent/models.json"
  merge = { providers = { "llama.cpp" = { baseUrl = "http://127.0.0.1:42137/v1", models = [ { id = "unsloth/Qwen3.8-27B-GGUF:Q8_0", name = "Qwen3.8 27B Q8 (local)", api = "openai-completions", reasoning = true, input = ["text", "image"], contextWindow = 262144, maxTokens = 32768, thinkingLevelMap = { off = "none", minimal = "low", low = "low", medium = "medium", high = "xhigh", xhigh = "xhigh", max = "xhigh" }, samplingParams = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repeat_penalty = 1.0 }, compat = { supportsStore = false, supportsDeveloperRole = true, supportsReasoningEffort = true, supportsUsageInStreaming = true, maxTokensField = "max_tokens", thinkingFormat = "openai" } }, { id = "empero-ai/Qwen3.8-9B-Distill-GGUF:Q8_0", name = "Qwen3.8 9B Distill Q8 (local reviewer)", api = "openai-completions", reasoning = true, input = ["text"], contextWindow = 32768, maxTokens = 8192, thinkingLevelMap = { off = "none", minimal = "low", low = "low", medium = "medium", high = "xhigh", xhigh = "xhigh", max = "xhigh" }, samplingParams = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repeat_penalty = 1.0 }, compat = { supportsStore = false, supportsDeveloperRole = true, supportsReasoningEffort = true, supportsUsageInStreaming = true, maxTokensField = "max_tokens", thinkingFormat = "openai" } } ] } } }

  # llama.cpp auth entry — SUBSET of live auth.json.
  [[packages.pi-llama.json-merge]]
  file = "~/.pi/agent/auth.json"
  merge = { "llama.cpp" = { type = "api_key", key = "local-pi", env = { LLAMA_BASE_URL = "http://127.0.0.1:42137" } } }

  # router launcher — bare `ln -sf`, no backup.
  [[packages.pi-llama.symlink]]
  from = "config/pi/llama-router.sh"
  to = "~/.local/bin/pi-llama-router"
  backup = false

  # llama.cpp router LaunchAgent — content matches the live plist. kempt renders
  # a canonical plist, so expect "+ service (update agent)" from format
  # normalization even when content matches (one-time, like muster).
  [[packages.pi-llama.service]]
  label = "dev.pi.llama-router"
  program = ["/bin/zsh", "-lc", "exec \"$HOME/.local/bin/pi-llama-router\""]
  keep-alive = true
  run-at-load = true
  process-type = "Interactive"
  throttle-interval = 10
  session-type = "Aqua"

  [[packages.pi-llama.verify]]
  command-exists = "llama-server"

  [[packages.pi-llama.verify]]
  http-ok = "http://127.0.0.1:42137/health"

