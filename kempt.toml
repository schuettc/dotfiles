# kempt.toml — a user layer on the subaud starter (subaud-tools/starter).
#
# The starter is the base: tmux, Ghostty and yazi, every suite tool with its
# release setup, the way of working (shared rules and process skills), and
# the adoptable pi and neovim packages. This layer adds only what is this
# repo's own: the shell, tmux and its helpers, editors' styles, Claude Code
# and Codex integration, the pi extensions and settings on top of the
# starter's, the muster channel in pi, and the family-internal skills. What
# the starter carries is changed there, never copied here: kempt refuses two
# layers linking one path from different sources.
#
# Add it on a machine set up from the starter:
#   kempt layer add dotfiles <checkout> -profile developer
#
# Layer packages are namespaced dotfiles/<pkg>, and an unqualified need names
# this layer's own package first, then the starter's: no package here is
# named pi, so `needs = ["pi"]` is the starter's pi.
#
# Linux (a billet workspace, Ubuntu 24.04 arm64): the `workspace` profile.
# Only steps that exist on a Mac alone (casks, Homebrew-only tools, ~/Library
# paths, launchd) carry `only = { os = "darwin" }`. An install step with an
# `apt` list installs it on Linux and its brew lists (casks included) on a
# Mac. What only Linux needs is in [packages.workspace-linux]. Node 24, the
# AWS CLI and uv come from the workspace's first boot, not from here;
# workspace-linux checks for them. pi-llama is optional and NOT in the
# developer profile; adopt it only on a box with local GGUF weights.

[kempt]
spec = 2
layer = "user"

# ---------------------------------------------------------------------------
# core — shell foundation: brew CLI tools, zsh, starship, atuin
# ---------------------------------------------------------------------------
[packages.core]
description = "Shell foundation: Homebrew CLI tools, zsh config, Starship prompt, Atuin history"

  [[packages.core.install]]
  brew.taps = ["1password/tap"]
  brew.formulas = [
    "starship", "atuin", "zsh-completions", "eza", "bat", "zoxide", "fzf",
    "fd", "ripgrep", "git-delta", "tree", "jq",
    "yq", "gh", "git", "pipx", "uv", "awscli",
  ]
  brew.casks = ["1password-cli", "visual-studio-code", "docker-desktop"]
  # Ubuntu 24.04 names. bat and fd install as batcat and fdfind
  # (linked in workspace-linux).
  # Not in Ubuntu, so Mac-only: starship, atuin, yq (Ubuntu's
  # yq is a different tool). uv and awscli come from the first boot.
  apt = [
    "zsh", "eza", "bat", "zoxide", "fzf", "fd-find", "ripgrep", "git-delta",
    "tree", "jq", "gh", "git", "pipx", "curl", "unzip",
  ]

  [[packages.core.symlink]]
  from = ".zshrc"
  to = "~/.zshrc"
  backup = true

  [[packages.core.symlink]]
  from = "config/zsh"
  to = "~/.config/zsh"
  backup = true

  [[packages.core.symlink]]
  from = "config/starship.toml"
  to = "~/.config/starship.toml"
  backup = true

  [[packages.core.symlink]]
  from = "config/atuin"
  to = "~/.config/atuin"
  backup = true

  # harness session-stamp — referenced by the claude + codex SessionStart hooks
  # through this stable ~/.local/bin path, so it resolves no matter where the
  # config repo is cloned (kempt init defaults to ~/.config/kempt/repo, not
  # ~/dotfiles). Lives in core because both harnesses depend on core.
  [[packages.core.symlink]]
  from = "bin/harness-session-stamp.sh"
  to = "~/.local/bin/harness-session-stamp"
  backup = false

  [[packages.core.verify]]
  command-exists = "starship"
  only = { os = "darwin" }

  [[packages.core.verify]]
  command-exists = "atuin"
  only = { os = "darwin" }

  [[packages.core.verify]]
  symlink-target = { link = "~/.zshrc", target = ".zshrc" }

# ---------------------------------------------------------------------------
# terminal — tmux config and helpers, build tools, and the
# personal Ghostty font and yazi config on top of the starter's. tmux itself,
# Ghostty, yazi, FiraCode Nerd Font and proj/scratch/creel come from the
# starter.
# ---------------------------------------------------------------------------
[packages.terminal]
description = "tmux config and helpers, go/just/lefthook/bash, personal Ghostty font and yazi config"
needs = ["core"]

  # just + lefthook: every .tools family repo's `just verify` and pre-push hook
  # (the same gate CI runs) need both; go builds them. bash: a current bash 5
  # for scripts and test suites that CI runs under bash 5 (tools-actions'
  # fork-sync suite refuses macOS's /bin/bash 3.2). /bin/bash is untouched.
  [[packages.terminal.install]]
  brew.formulas = ["go", "just", "lefthook", "bash"]
  # Linux: lefthook stays Mac-only (not in Ubuntu); Ubuntu's own bash is 5.2.
  apt = ["golang-go", "just"]

  # The personal Ghostty font. The starter links ~/.config/ghostty/config;
  # Ghostty loads this macOS file after it, so its values win
  # (ghostty.org/docs/config).
  [[packages.terminal.symlink]]
  from = "config/ghostty/config.mac"
  to = "~/Library/Application Support/com.mitchellh.ghostty/config"
  backup = true
  only = { os = "darwin" }

  [[packages.terminal.symlink]]
  from = ".tmux.conf"
  to = "~/.tmux.conf"
  backup = true

  # yazi with the MarkEdit opener. The starter links ~/.config/yazi, so this
  # one lives beside it and config/zsh/01-paths.zsh points YAZI_CONFIG_HOME
  # here.
  [[packages.terminal.symlink]]
  from = "config/yazi"
  to = "~/.config/yazi-user"
  backup = true

  # tmux helpers .tmux.conf runs, at a stable path wherever this repo is
  # checked out.
  [[packages.terminal.symlink]]
  from = "bin/tmux-claude-context.sh"
  to = "~/.local/bin/tmux-claude-context.sh"
  backup = false

  [[packages.terminal.symlink]]
  from = "bin/tmux-git-status.sh"
  to = "~/.local/bin/tmux-git-status.sh"
  backup = false

  [[packages.terminal.symlink]]
  from = "bin/tmux-session-color.sh"
  to = "~/.local/bin/tmux-session-color.sh"
  backup = false

  [[packages.terminal.symlink]]
  from = "bin/tmux-session-rename.sh"
  to = "~/.local/bin/tmux-session-rename.sh"
  backup = false

  [[packages.terminal.symlink]]
  from = "bin/tmux-sidebar-toggle.sh"
  to = "~/.local/bin/tmux-sidebar-toggle.sh"
  backup = false

  [[packages.terminal.symlink]]
  from = "bin/tmux-teammate-gc.sh"
  to = "~/.local/bin/tmux-teammate-gc.sh"
  backup = false

  [[packages.terminal.verify]]
  symlink-target = { link = "~/.tmux.conf", target = ".tmux.conf" }

# Optional; adopt explicitly, never through a default profile.
[packages.session-themes]
description = "Optional persistent terminal session themes"
needs = ["terminal"]

  # A Mac's only: a workspace links config/proj/config.workspace.toml to the
  # same path, from workspace-linux.
  [[packages.session-themes.symlink]]
  from = "config/proj/config.toml"
  to = "~/.config/proj/config.toml"
  backup = true
  only = { os = "darwin" }

# ---------------------------------------------------------------------------
# markedit — MarkEdit markdown-editor styles
# ---------------------------------------------------------------------------
[packages.markedit]
description = "MarkEdit markdown-editor styles"
needs = ["core"]
only = { os = "darwin" }

  [[packages.markedit.install]]
  brew.casks = ["markedit"]

  [[packages.markedit.symlink]]
  from = "config/markedit/editor.css"
  to = "~/Library/Containers/app.cyan.markedit/Data/Documents/editor.css"
  backup = true

  [[packages.markedit.verify]]
  symlink-target = { link = "~/Library/Containers/app.cyan.markedit/Data/Documents/editor.css", target = "config/markedit/editor.css" }

# ---------------------------------------------------------------------------
# claude — Claude Code statusline, hooks, claude-attn CLI
# ---------------------------------------------------------------------------
[packages.claude]
description = "Claude Code CLI + integration: tmux-aware statusline, attention-bell hooks, claude-attn CLI"
needs = ["core"]

  # The native `claude` binary (Homebrew cask claude-code).
  [[packages.claude.install]]
  brew.casks = ["claude-code"]
  only = { os = "darwin" }

  [[packages.claude.symlink]]
  from = "config/claude"
  to = "~/.config/claude"
  backup = true

  [[packages.claude.symlink]]
  from = "bin/claude-attn"
  to = "~/.local/bin/claude-attn"
  backup = false

  # The pane lookup claude-notify.sh runs to ring the right tmux bell.
  [[packages.claude.symlink]]
  from = "bin/tmux-hook-pane.sh"
  to = "~/.local/bin/tmux-hook-pane.sh"
  backup = false

  # superpowers is removed from the harness (2026-09-30). pi-claude-bridge runs
  # Claude Code with its default setting sources, so an enabled CC plugin's
  # SessionStart hook injects into pi sessions too — keep it off here as well.
  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { enabledPlugins = { "superpowers@claude-plugins-official" = false } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { statusLine = { type = "command", command = "~/.config/claude/statusline.sh" } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { permissions = { allow = ["Bash(*/.claude/sessions/*)"] } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { Notification = [ { hooks = [ { type = "command", command = "~/.config/claude/claude-notify.sh" } ] } ] } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { Stop = [ { hooks = [ { type = "command", command = "~/.config/claude/claude-notify.sh" } ] }, { hooks = [ { type = "command", command = "~/.config/claude/claude-teammate-idle.sh" } ] } ] } }

  [[packages.claude.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { SessionStart = [ { hooks = [ { type = "command", command = "~/.local/bin/harness-session-stamp" } ] } ] } }

  [[packages.claude.verify]]
  symlink-target = { link = "~/.config/claude", target = "config/claude" }

  # Linux installs claude from npm in workspace-linux, after this package, and
  # checks it there.
  [[packages.claude.verify]]
  command-exists = "claude"
  only = { os = "darwin" }

# ---------------------------------------------------------------------------
# codex — OpenAI Codex CLI + MCP bridge into Claude Code
# ---------------------------------------------------------------------------
[packages.codex]
description = "OpenAI Codex CLI (GPT agent) + MCP bridge into Claude Code"
needs = ["core"]
notes = ["run `codex login` to authenticate"]

  [[packages.codex.install]]
  brew.casks = ["codex"]
  only = { os = "darwin" }

  # session-stamp hook. codex hooks.json does not expand ~, so kempt expands the
  # ${HOME} token at write time into an absolute, per-machine path.
  [[packages.codex.json-merge]]
  file = "~/.codex/hooks.json"
  merge = { hooks = { SessionStart = [ { hooks = [ { type = "command", command = "${HOME}/.local/bin/harness-session-stamp" } ] } ] } }

  # `claude mcp add codex` writes into ~/.claude.json .mcpServers
  [[packages.codex.json-merge]]
  file = "~/.claude.json"
  merge = { mcpServers = { codex = { type = "stdio", command = "codex", args = ["mcp-server"], env = {} } } }

  [[packages.codex.verify]]
  command-exists = "codex"
  only = { os = "darwin" }

# ---------------------------------------------------------------------------
# swiftbar — menu-bar attention indicator (🔔 turn-done / 🔐 waiting-on-you per
# Claude/pi session; the plugin at config/swiftbar/plugins/ is driven by
# claude-attn + the pi harness). Actively used, so kempt installs the app and
# links the plugins; the three macOS one-offs (plugin folder, autostart,
# accessibility) are manual notes.
# ---------------------------------------------------------------------------
[packages.swiftbar]
description = "SwiftBar menu-bar attention indicator for Claude/pi sessions"
needs = ["claude"]
only = { os = "darwin" }
notes = [
  "point SwiftBar at the linked plugins: defaults write com.ameba.SwiftBar PluginDirectory ~/.config/swiftbar/plugins",
  "add SwiftBar to Login Items (System Settings) to auto-start it",
  "grant SwiftBar Accessibility permission (System Settings → Privacy) so click-to-focus works",
]

  [[packages.swiftbar.install]]
  brew.casks = ["swiftbar"]

  [[packages.swiftbar.symlink]]
  from = "config/swiftbar/plugins"
  to = "~/.config/swiftbar/plugins"
  backup = true

# ---------------------------------------------------------------------------
# pi-personal — the user's own pi extensions and settings on top of the
# starter's pi package (which owns the base extension list, the fork pins,
# claude-bridge.json, the worker/reviewer agents and subagents.json).
#
# kempt folds a replace array declared by several layers into the ordered
# union of what each declares, so the packages list below adds to the
# starter's and the permission config's promptAnswerers replaces its empty
# list. Scalars set here (defaultModel, yoloMode) win over the base.
#
# pi-provider-guard reads optional private policy prose from
# ~/.pi/agent/extensions/pi-provider-guard/config.json (the private layer
# links it); absent, the extension is a no-op.
# ---------------------------------------------------------------------------
[packages.pi-personal]
description = "Personal pi extensions and settings on top of the starter's pi: artifacts, provider guard, TypeSafe, hail, casebook, yolo mode"
needs = ["pi"]

  # Version policy: an unversioned entry rolls to the newest release on
  # `kempt update`; a pinned name@version stays on exactly that version. Must
  # match the settings.json `packages` list below string for string.
  [[packages.pi-personal.install]]
  pi = [
    "npm:@nicknisi/pi-artifacts",
    # Our own, from the pi-extensions monorepo.
    "npm:pi-provider-guard@0.1.0",
    # TypeSafe Jev credential UX (bare `/typesafe` panel, or setup|status|
    # logout, key stored at ~/.pi/agent/typesafe/config.json 0600). Also the
    # client library Jev-backed extensions use.
    "npm:pi-typesafe-ai@0.2.0",
    # The pane end of hail (hail.tools, whose package is in the private
    # layer); pinned to the release the hail daemon was accepted with.
    "npm:pi-hail@0.8.0",
    # Journals git/gh bash calls with the pi session and briefs the first
    # turn. Unpinned: casebook publishes the binary before the extension, so a
    # new pi-casebook never arrives ahead of it.
    "npm:pi-casebook",
  ]

  [[packages.pi-personal.json-merge]]
  file = "~/.pi/agent/settings.json"
  arrays = "replace"
  merge = { defaultModel = "claude-opus-5-5", packages = [ "npm:@nicknisi/pi-artifacts", "npm:pi-provider-guard@0.1.0", "npm:pi-typesafe-ai@0.2.0", "npm:pi-hail@0.8.0", "npm:pi-casebook" ], skills = [] }

  # The permission policy on top of the starter's: yolo mode on (tool calls run
  # without asking; the starter's denies still hold), pi-hail as the prompt
  # answerer for phone approvals, and the allow entries the starter leaves
  # out, which record surfaces that never need a prompt if yolo is turned off.
  [[packages.pi-personal.json-merge]]
  file = "~/.pi/agent/extensions/pi-permission-system/config.json"
  arrays = "replace"
  merge = { "permission" = { "bash" = { "git push *" = "allow", "gh api *" = "allow", "gh auth *" = "allow", "gh pr *" = "allow", "gh repo *" = "allow", "aws sso login *" = "allow", "aws s3 ls *" = "allow" }, "pi_codex_usage" = "allow" }, "yoloMode" = true, "promptAnswerers" = [ "pi-hail" ] }

  # pi-mcp-adapter stores MCP OAuth tokens as AES-256-GCM files under
  # ~/.pi/agent/mcp-oauth-encrypted/ instead of the macOS Keychain, so pi never
  # raises Keychain prompts. The key comes from PI_MCP_ADAPTER_OAUTH_FILE_KEY,
  # which config/zsh/07-mcp-oauth.zsh creates per machine and exports. Without
  # it the adapter fails closed (no plaintext fallback). Hand-added servers and
  # settings in this file survive: the merge is additive.
  [[packages.pi-personal.json-merge]]
  file = "~/.pi/agent/mcp-adapter.json"
  merge = { settings = { oauthCredentialStore = "encrypted-file" } }

# ---------------------------------------------------------------------------
# pi-channels — wire muster into pi sessions. channels.tools (the starter's pi)
# spawns nothing until ~/.pi/agent/channels.json names the channel servers;
# the other suite tools add their own entries through their release setup, but
# muster's release declares neither its pi channel nor its pi MCP server, so
# both are here. Bare `muster` (resolved via $PATH): pi spawns channel and MCP
# servers with the session's login PATH, which includes ~/.local/bin.
# ---------------------------------------------------------------------------
[packages.pi-channels]
description = "Wire muster into pi sessions: its channel (channels.json) and MCP server (mcp.json)"
needs = ["pi", "muster"]

  [[packages.pi-channels.json-merge]]
  file = "~/.pi/agent/channels.json"
  merge = { channelServers = { "muster-channel" = { command = "muster", args = ["channel"] } } }

  # pi-mcp-adapter reads ~/.config/mcp/mcp.json (the all-projects target) and
  # exposes muster's get_inbox/get_thread/reply/... through its lazy mcp()
  # proxy, the same tool surface Claude and Codex have. Deep-merge is
  # additive: hand-added servers survive.
  [[packages.pi-channels.json-merge]]
  file = "~/.config/mcp/mcp.json"
  merge = { mcpServers = { muster = { command = "muster", args = ["mcp"] } } }

# ---------------------------------------------------------------------------
# family-skills — the skills for building and releasing .tools family tools,
# for pi. Each is linked as its own folder, since the starter and the tool
# releases write their own skills beside them; an edit here is live at once.
# ---------------------------------------------------------------------------
[packages.family-skills]
description = "The .tools family build, release and onboarding skills, for pi"
needs = ["core"]

  [[packages.family-skills.symlink]]
  from = "config/pi/skills/building-a-tools-family-tool"
  to = "~/.pi/agent/skills/building-a-tools-family-tool"
  backup = true

  [[packages.family-skills.symlink]]
  from = "config/pi/skills/releasing-a-tools-family-tool"
  to = "~/.pi/agent/skills/releasing-a-tools-family-tool"
  backup = true

  [[packages.family-skills.symlink]]
  from = "config/pi/skills/tools-family-onboarding"
  to = "~/.pi/agent/skills/tools-family-onboarding"
  backup = true

# ---------------------------------------------------------------------------
# pi-llama — OPTIONAL local llama.cpp inference rig for pi (our own setup).
# Needs the starter's pi.
# Not in the developer profile: it needs GGUF model weights this manifest does
# not fetch, so a fresh machine converges clean WITHOUT it. Add it deliberately
# on a box that has the models with `kempt adopt pi-llama`.
# ---------------------------------------------------------------------------
[packages.pi-llama]
description = "Optional local llama.cpp inference provider + router for pi (requires local GGUF weights)"
needs = ["pi"]
only = { os = "darwin" }
notes = ["download the Qwen3.8 27B + 9B GGUF weights the router serves; pi-llama does not fetch them"]

  [[packages.pi-llama.install]]
  brew.formulas = ["llama.cpp"]

  # llama.cpp provider subtree — SUBSET of live models.json (append array mode).
  [[packages.pi-llama.json-merge]]
  file = "~/.pi/agent/models.json"
  merge = { providers = { "llama.cpp" = { baseUrl = "http://127.0.0.1:42137/v1", models = [ { id = "unsloth/Qwen3.8-27B-GGUF:Q8_0", name = "Qwen3.8 27B Q8 (local)", api = "openai-completions", reasoning = true, input = ["text", "image"], contextWindow = 262144, maxTokens = 32768, thinkingLevelMap = { off = "none", minimal = "low", low = "low", medium = "medium", high = "xhigh", xhigh = "xhigh", max = "xhigh" }, samplingParams = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repeat_penalty = 1.0 }, compat = { supportsStore = false, supportsDeveloperRole = true, supportsReasoningEffort = true, supportsUsageInStreaming = true, maxTokensField = "max_tokens", thinkingFormat = "openai" } }, { id = "empero-ai/Qwen3.8-9B-Distill-GGUF:Q8_0", name = "Qwen3.8 9B Distill Q8 (local reviewer)", api = "openai-completions", reasoning = true, input = ["text"], contextWindow = 32768, maxTokens = 8192, thinkingLevelMap = { off = "none", minimal = "low", low = "low", medium = "medium", high = "xhigh", xhigh = "xhigh", max = "xhigh" }, samplingParams = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repeat_penalty = 1.0 }, compat = { supportsStore = false, supportsDeveloperRole = true, supportsReasoningEffort = true, supportsUsageInStreaming = true, maxTokensField = "max_tokens", thinkingFormat = "openai" } } ] } } }

  # llama.cpp auth entry — SUBSET of live auth.json.
  [[packages.pi-llama.json-merge]]
  file = "~/.pi/agent/auth.json"
  merge = { "llama.cpp" = { type = "api_key", key = "local-pi", env = { LLAMA_BASE_URL = "http://127.0.0.1:42137" } } }

  # router launcher — bare `ln -sf`, no backup.
  [[packages.pi-llama.symlink]]
  from = "config/pi/llama-router.sh"
  to = "~/.local/bin/pi-llama-router"
  backup = false

  # llama.cpp router LaunchAgent — content matches the live plist. kempt renders
  # a canonical plist, so expect "+ service (update agent)" from format
  # normalization even when content matches (one-time, like muster).
  [[packages.pi-llama.service]]
  label = "dev.pi.llama-router"
  program = ["/bin/zsh", "-lc", "exec \"$HOME/.local/bin/pi-llama-router\""]
  keep-alive = true
  run-at-load = true
  process-type = "Interactive"
  throttle-interval = 10
  session-type = "Aqua"

  [[packages.pi-llama.verify]]
  command-exists = "llama-server"

  [[packages.pi-llama.verify]]
  http-ok = "http://127.0.0.1:42137/health"

# ---------------------------------------------------------------------------
# workspace-linux — what a Linux workspace adds to the packages above: claude
# and codex from npm (casks on a Mac), Ubuntu's bat and fd under the names the
# zsh config and FZF_DEFAULT_COMMAND use, and checks for what billet's first
# boot installs (Node 24, the AWS CLI, uv), and proj's config without the
# sidebar. Linux only; in the workspace profile alone.
# ---------------------------------------------------------------------------
[packages.workspace-linux]
description = "Linux workspace additions: claude and codex from npm, bat/fd names, first-boot checks"
needs = ["core", "claude", "codex"]
only = { os = "linux" }

  [[packages.workspace-linux.verify]]
  command-exists = "node"

  [[packages.workspace-linux.verify]]
  command-exists = "aws"

  [[packages.workspace-linux.verify]]
  command-exists = "uv"

  # Each check comes after the step that installs what it checks: kempt
  # re-checks a verify after apply only in a package that changed something.
  # Not needing pi keeps a first apply's blocked pi extensions (pi is not on
  # PATH until its own npm step ran) from holding these back.
  [[packages.workspace-linux.install]]
  npm = ["@anthropic-ai/claude-code", "@openai/codex"]

  [[packages.workspace-linux.symlink]]
  from = "/usr/bin/batcat"
  to = "~/.local/bin/bat"
  backup = false

  [[packages.workspace-linux.symlink]]
  from = "/usr/bin/fdfind"
  to = "~/.local/bin/fd"
  backup = false

  # proj without the sidebar: a workspace session is the agent's pane alone.
  [[packages.workspace-linux.symlink]]
  from = "config/proj/config.workspace.toml"
  to = "~/.config/proj/config.toml"
  backup = true

  [[packages.workspace-linux.verify]]
  command-exists = "claude"

  [[packages.workspace-linux.verify]]
  command-exists = "codex"

# ---------------------------------------------------------------------------
# Profiles. session-themes and pi-llama are adopt-only.
# ---------------------------------------------------------------------------
[profiles.developer]
description = "Everything this layer adds on a Mac: shell, terminal, editors' styles, agents"
packages = ["core", "terminal", "markedit", "claude", "swiftbar", "codex", "family-skills", "pi-personal", "pi-channels"]

# A billet workspace (Ubuntu 24.04 arm64): developer without the Mac apps.
[profiles.workspace]
description = "A remote workspace: shell, tmux, agents; no desktop apps"
packages = ["core", "terminal", "claude", "codex", "family-skills", "pi-personal", "pi-channels", "workspace-linux"]

[profiles.minimal]
description = "Just the core command-line tools"
packages = ["core"]
