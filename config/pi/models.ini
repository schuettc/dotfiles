version = 1

; Safe defaults inherited by every model loaded through the router.
[*]
parallel = 1
n-gpu-layers = 999
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 2048
ubatch-size = 512
cache-prompt = true
fit = off

; Small fast reviewer model for pi-auto-review.
[empero-ai/Qwen3.8-9B-Distill-GGUF:Q8_0]
hf-repo = empero-ai/Qwen3.8-9B-Distill-GGUF:Q8_0
ctx-size = 32768

; Qwen-specific full-context and MTP configuration.
[unsloth/Qwen3.8-27B-GGUF:Q8_0]
hf-repo = unsloth/Qwen3.8-27B-GGUF:Q8_0
ctx-size = 262144
image-min-tokens = 1024
image-max-tokens = 2048
spec-type = draft-mtp
spec-draft-n-max = 2
