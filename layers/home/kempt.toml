# HOME layer: tools for personal machines only, applied on top of the base
# (kempt.toml at the repo root). Add it on a machine that should have them:
#   kempt layer add home <checkout>/layers/home
# where <checkout> is this repo's clone (kempt init's default is
# ~/.config/kempt/repo).
# Leave it off a work machine. Public, like the base; private settings go in
# dotfiles-private.
[kempt]
spec = 2
layer = "user"

[profiles.home]
description = "casebook and cull"
packages = ["casebook", "cull"]

# ---------------------------------------------------------------------------
# casebook — the fate of every repo, PR, issue, branch and worktree
# (casebook.tools). Its release setup supplies the Claude hooks and plugin, the
# pi channel and the sync service; the pi-casebook extension stays here with
# the other pi packages.
# First run on a new machine:
# `casebook init` and `casebook hooks install` (see casebook.tools/guide).
# ---------------------------------------------------------------------------
[packages.casebook]
description = "casebook: triage page, agent channel, rules and apply (casebook.tools)"
needs = ["pi"]
only = { os = "darwin" }

  [[packages.casebook.download]]
  site = "casebook.tools"
  tool = "casebook"
  bin = "casebook"
  setup = true

  [[packages.casebook.verify]]
  command-exists = "casebook"

  # pi: the pi-casebook extension (journals git/gh bash calls with the pi
  # session, briefs the first turn). Unpinned: casebook publishes the binary
  # before the extension, so a new pi-casebook never arrives ahead of it. The
  # base sets pi's packages with arrays = "replace"; kempt adds this entry to it.
  [[packages.casebook.install]]
  pi = ["npm:pi-casebook"]

  [[packages.casebook.json-merge]]
  file = "~/.pi/agent/settings.json"
  arrays = "append"
  merge = { packages = ["npm:pi-casebook"] }

# ---------------------------------------------------------------------------
# cull — judges agent-written tests with TypeSafe's Jev, removes the ones Jev is
# sure don't earn their place, and puts the rest on a review page (tackle.tools).
# Its release setup supplies the Claude plugin and the pi channel.
# First run in each project: `cull init` (asks for the TypeSafe key once, and
# whether that project's test source may be sent to TypeSafe).
# ---------------------------------------------------------------------------
[packages.cull]
description = "cull: judges agent-written tests and reviews the uncertain ones on a page, with an agent channel (tackle.tools)"
only = { os = "darwin" }

  [[packages.cull.download]]
  site = "tackle.tools"
  product = "tackle"
  tool = "cull"
  bin = "cull"
  setup = true

  [[packages.cull.verify]]
  command-exists = "cull"
